[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffugen"
version = "0.1.0"
description = "Generate tiled art from Gray-Scott reaction-diffusion simulations."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pillow>=10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
diffugen = "diffugen.cli:main"

[tool.setuptools.packages.find]
include = ["diffugen*"]
