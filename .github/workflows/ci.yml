name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Generate a smoke image
        run: >-
          python -m diffugen --preset standard --size 16 --steps 5
          --scale 2 --seed 42 --output /tmp/diffugen-ci-smoke.png

      - name: Verify smoke image
        run: >-
          python -c "from PIL import Image; image = Image.open('/tmp/diffugen-ci-smoke.png');
          assert image.size == (900, 900); image.verify()"
